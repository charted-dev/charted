    sentry:
        name: Sentry
        runs-on: ubuntu-24.04
        if: ${{github.repository == 'charted-dev/charted'}}
        steps:
            - uses: auguwu/git-tag-action@94e2bc997afd37c11c2d43a098006ef5ce92bb79 # master
              id: tag

            - uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3
              env:
                  SENTRY_AUTH_TOKEN: ${{secrets.SENTRY_AUTH_TOKEN}}
                  SENTRY_PROJECT: charted-server
                  SENTRY_URL: https://sentry.noelware.org
              with:
                  environment: production
                  release: ${{steps.tag.outputs.version}}
